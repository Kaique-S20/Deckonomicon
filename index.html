<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DECKONOMICON</title>
    
    <!-- CSS Global (cores, fontes, fundo) -->
    <link rel="stylesheet" href="frontend/style/css/style.css">
    
    <!-- CSS Específico do Login (Card, botões, alinhamento) -->
    <link rel="stylesheet" href="frontend/style/css/login.css">
</head>
<body>
    <!--Cabeçalho principal-->
    <header>
        <h1>DECKONOMICON</h1>
    </header>

    <main>
        <div class="login-container">
            <h2>Acesse sua Conta</h2>

            <form action="frontend/html/home.html">
                <!--label para o email-->
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

            <!--label para a senha -->
                <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Sua Senha" required>
                </div>

            <!--label para criar conta-->
                <div class="links-adicionais">
                <p>Criar conta<a href="frontend/cadastro.html"> Cadastre-se aqui</a></p>
                </div>

            <!--Esqueceu senha-->
                <div class="forgot-password">
                    <a href="frontend/recuperarSenha.html">Esqueceu Senha?</a>
                </div>

                <!--Botão de Confirmação de conta-->
                <button type="submit" class="btn-login">Confirmar</button>
            </form>
        </div>
    </main>

    <!--Rodapé-->
    <footer>
        <p>&copy; 2026 Deckonomicon. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
