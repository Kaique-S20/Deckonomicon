<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Deckonomicon</title>
</head>
<body>

    <!-- Cabeçalho principal -->
    <header>
        <h1>Deckonomicon</h1>
    </header>

    <main>
        <div class="recuperar-container">
            <h2>Esqueceu sua senha?</h2>
            
            <p>Digite seu email abaixo e enviaremos um link para redefinir sua senha.</p>
            
            <form>
                <div class="input-group">
                    <label for="email-recuperacao">Email cadastrado</label>
                    <input type="email" id="email-recuperacao" placeholder="seu@email.com" required>
                </div>

                <button type="submit" class="btn-recuperar">Enviar link de recuperação</button>

                <div class="links-adicionais">
                    <p>Lembrou a senha? <a href="index.html">Voltar para o login</a></p>
                </div>
            </form>
        </div>
    </main>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2026 Deckonomicon. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
