<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Deckonomicon</title>
</head>
<body>

    <header>
        <h2>Deckonomicon</h2>
        <nav aria-label="Navegação Principal">
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="perfil.html">Voltar ao Perfil</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Configurações da Conta</h1>
        
        <form action="perfil.html">
            
            <fieldset>
                <legend>Informações Públicas</legend>
                
                <div class="input-group">
                    <label for="nome-exibicao">Nome de Exibição</label>
                    <input type="text" id="nome-exibicao" value="Kaique Stefani Xavier" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Privacidade</legend>
                
                <div class="input-group">
                    <input type="checkbox" id="perfil-privado" name="privacidade" value="privado">
                    <label for="perfil-privado">Tornar meu perfil e meus decks privados</label>
                </div>
                
                <div class="input-group">
                    <input type="checkbox" id="receber-emails" name="notificacoes" value="emails" checked>
                    <label for="receber-emails">Receber alertas de queda de preços no email</label>
                </div>
            </fieldset>

            <div class="acoes-form">
                <button type="submit">Salvar Alterações</button>
                <button type="reset">Cancelar</button> 
            </div>
            
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Deckonomicon. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
