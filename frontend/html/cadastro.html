<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Deckonomicon</title>

</head>
<body>
<!--Cabeçalho principal-->
    <header>
        <h1>Deckonomicon</h1>
    </header>

    <main>
        <div class="cadastro-container">
            <h2>Crie sua conta</h2>
            <form>
                <div class="nome">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Nome" required>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Sua senha" required>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirmar senha</label>
                    <input type="password" id="confirm-password" placeholder="Confirmar-senha" required>
                </div>

                <button type="submit" class="btn-login">Confirmar</button>

                <div class="links-adicionais">
                    <p>Já possui uma conta?<a href="index.html">Faça login aqui</a></p>
                </div>
            </form>
        </div>
    </main>

<!--Rodapé-->
    <footer>
        <p>&copy; 2026 Deckonomicon. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
