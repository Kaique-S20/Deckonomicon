    <!-- Biblioteca de Ícones de Mana do MTG -->

    <!-- Estilo específico da busca centralizada -->
    <link rel="stylesheet" href="../style/css/home.css">

    <!-- Puxa o tema escuro global -->
    <link rel="stylesheet" href="../style/css/style.css">
    
    <!-- Estilo específico da busca centralizada -->
    <link rel="stylesheet" href="../style/css/home.css">

    <!-- CSS dos Modais do Sistema (ESSENCIAL PARA FUNCIONAR) -->
    <link rel="stylesheet" href="../style/css/modal.css">

</head>
<body>

    <!-- Novo Cabeçalho padronizado (Igual ao da Comunidade) -->
    <header>
        <h2>DECKONOMICON</h2>
        <nav aria-label="Navegação Principal">
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="meus-decks.html">Meus Decks</a></li>
                <li><a href="comunidade.html">Comunidade</a></li>
                <li><a href="configuracoes.html">Configurações</a></li>
                <li><a href="perfil.html">Perfil</a></li>
                <li><a href="../../index.html">Sair</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero-busca">
            <h1>DECKONOMICON</h1>
            <p>A sua plataforma definitiva para construir decks de Magic: The Gathering</p>

            <form>
                <div class="input-busca-group">
                    <label for="busca-principal">O que você está procurando?</label>
                    <input type="search" id="busca-principal" placeholder="Ex: Ygra, Eater of All..." required>
                    <button type="submit">Pesquisar</button>
                </div>
            </form>
                <!-- Espaço reservado para o JS injetar os resultados -->
                <div id="resultados-busca" class="resultados-container"></div>
        </section>
    </main>

    <!-- Modal para exibir a carta em tela cheia -->
    <div id="modal-carta">
        <div class="modal-imagem-conteudo">
            <span class="btn-fechar-imagem">&times;</span>
            <img id="img-carta-modal" src="" alt="Arte da Carta em Alta Resolução">
            <!-- Espaço reservado para o preço -->
            <h3 id="preco-carta-modal" style="color: var(--brand-color); margin-top: 15px; font-weight: bold;"></h3>
        </div>
    </div>
