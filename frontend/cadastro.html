<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Deckonomicon</title>

    <!-- Puxa o tema escuro global (cores, fontes, rodapé) -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- Reaproveita o layout de card centralizado do Login! -->
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
    <!--Cabeçalho principal-->
    <header>
        <h1>DECKONOMICON</h1>
    </header>

    <main>
        <!-- Usando a classe do login para herdar o visual do Card -->
        <div class="login-container">
            <h2>Crie sua conta</h2>
            
            <!-- Caminho corrigido: ../ volta uma pasta e acha o index.html -->
            <form action="../index.html">
                
                <div class="input-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Seu nome completo" required>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Sua senha" required>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirmar senha</label>
                    <input type="password" id="confirm-password" placeholder="Confirme sua senha" required>
                </div>

                <button type="submit" class="btn-login">Confirmar</button>

                <div class="links-adicionais">
                    <!-- Caminho corrigido: ../ volta uma pasta e acha o index.html -->
                    <p>Já possui uma conta? <a href="../index.html">Faça login aqui</a></p>
                </div>
            </form>
        </div>
    </main>

    <!--Rodapé-->
    <footer>
        <p>&copy; 2026 Deckonomicon. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
