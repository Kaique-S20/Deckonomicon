<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Deckonomicon</title>

    <!-- Puxa o tema escuro global (cores, fontes, cabeçalho) -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- Estilo específico para o painel de configurações -->
    <link rel="stylesheet" href="assets/css/configuracoes.css">
</head>
<body>

    <header>
        <h2>DECKONOMICON</h2>
        <nav aria-label="Navegação Principal">
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="meus-decks.html">Meus Decks</a></li>
                <li><a href="comunidade.html">Comunidade</a></li>
                <li><a href="configuracoes.html">Configurações</a></li>
                <li><a href="perfil.html">Perfil</a></li>
                <li><a href="../index.html">Sair</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="config-container">
            <h1>Configurações da Conta</h1>
            
            <form action="perfil.html">
                
                <fieldset>
                    <legend>Informações Públicas</legend>
                    
                    <div class="input-text-group">
                        <label for="nome-exibicao">Nome de Exibição</label>
                        <input type="text" id="nome-exibicao" value="Kaique Stefani Xavier" required>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Privacidade e Alertas</legend>
                    
                    <div class="check-group">
                        <input type="checkbox" id="perfil-privado" name="privacidade" value="privado">
                        <label for="perfil-privado">Tornar meu perfil e meus decks privados</label>
                    </div>
                    
                    <div class="check-group">
                        <input type="checkbox" id="receber-emails" name="notificacoes" value="emails" checked>
                        <label for="receber-emails">Receber alertas de queda de preços no email</label>
                    </div>
                </fieldset>

                <div class="acoes-form">
                    <button type="submit" class="btn-salvar">Salvar Alterações</button>
                    <button type="reset" class="btn-cancelar">Cancelar</button> 
                </div>
                
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Deckonomicon. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
